<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VideoGrab - YouTube Downloader</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            min-height: 100vh;
            color: #f1f5f9;
            padding: 2rem 1rem;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 3rem;
        }

        .logo {
            font-size: 42px;
            font-weight: 600;
            color: #10b981;
            margin-bottom: 0.5rem;
        }

        .tagline {
            color: #94a3b8;
            font-size: 16px;
        }

        .input-section {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 16px;
            padding: 2rem;
            margin-bottom: 2rem;
            box-shadow: 0 20px 25px rgba(0,0,0,0.3);
        }

        .input-label {
            display: block;
            color: #cbd5e1;
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 0.75rem;
        }

        input[type="text"] {
            width: 100%;
            padding: 12px 16px;
            background: #0f172a;
            border: 1px solid #475569;
            border-radius: 8px;
            color: #f1f5f9;
            font-size: 15px;
            margin-bottom: 1.5rem;
            transition: border-color 0.2s;
            box-sizing: border-box;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: #10b981;
        }

        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-primary {
            background: #10b981;
            color: white;
        }

        .btn-primary:hover {
            background: #059669;
            transform: translateY(-2px);
            box-shadow: 0 8px 16px rgba(16, 185, 129, 0.3);
        }

        .btn-status {
            margin-top: 1rem;
            padding: 1rem;
            border-radius: 8px;
            display: none;
            word-break: break-all;
        }

        .status-success {
            background: #064e3b;
            border: 1px solid #059669;
            color: #a7f3d0;
        }

        .status-error {
            background: #7f1d1d;
            border: 1px solid #991b1b;
            color: #fecaca;
        }

        .status-info {
            background: #1e3a8a;
            border: 1px solid #3b82f6;
            color: #bfdbfe;
        }

        .dl-btn {
            display: inline-block;
            margin-top: 10px;
            padding: 10px 20px;
            background: #10b981;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo">▶ VideoGrab</div>
            <p class="tagline">Download YouTube videos & audio directly</p>
        </div>

        <div class="input-section">
            <label class="input-label" for="urlInput">YouTube URL</label>
            <input 
                type="text" 
                id="urlInput" 
                placeholder="Paste YouTube URL (youtube.com/watch?v=...)"
            />
            <button class="btn btn-primary" id="fetchBtn">Fetch & Download Video</button>

            <div id="statusBox" class="btn-status"></div>
        </div>
    </div>

    <script>
    document.getElementById('fetchBtn').addEventListener('click', downloadVideo);

    async function downloadVideo() {
        const urlInput = document.getElementById('urlInput').value.trim();
        const statusBox = document.getElementById('statusBox');

        if (!urlInput) {
            showStatus("Please enter a valid YouTube video URL.", "error");
            return;
        }

        // Extract Video ID from YouTube URL (handles watch, shorts, and embed formats)
        const videoIdMatch = urlInput.match(/(?:youtu\.be\/|youtube\.com\/(?:embed\/|v\/|watch\?v=|watch\?.+&v=))([\w-]{11})/);
        
        if (!videoIdMatch || !videoIdMatch[1]) {
            showStatus("Invalid YouTube URL. Please enter a full YouTube link.", "error");
            return;
        }

        const videoId = videoIdMatch[1];
        showStatus("⏳ Fetching video streams...", "info");

        try {
            // Using Piped public API for CORS-friendly stream extraction
            const response = await fetch(`https://pipedapi.kavin.rocks/streams/${videoId}`);

            if (!response.ok) {
                throw new Error(`Server returned status ${response.status}`);
            }

            const data = await response.json();

            if (data.videoStreams && data.videoStreams.length > 0) {
                let htmlContent = `<p style="margin-bottom: 12px;">✅ <strong>${data.title || 'Video Streams'}</strong></p>`;
                htmlContent += `<p style="font-size: 14px; margin-bottom: 10px;">Select quality to download:</p>`;
                htmlContent += `<div style="display: flex; flex-wrap: wrap; gap: 8px;">`;

                // Filter video streams that contain audio or offer direct playback
                const usableStreams = data.videoStreams.filter(s => s.url);

                usableStreams.slice(0, 6).forEach(stream => {
                    htmlContent += `
                        <a href="${stream.url}" class="dl-btn" target="_blank" rel="noopener" download>
                            ${stream.quality || 'Download'} (${stream.format || 'MP4'})
                        </a>
                    `;
                });

                htmlContent += `</div>`;
                showStatus(htmlContent, "success");
            } else {
                showStatus("No direct video streams found for this video.", "error");
            }
        } catch (err) {
            console.error(err);
            showStatus("Failed to extract video streams. YouTube may have updated its restrictions or the API rate limit was hit.", "error");
        }
    }

    function showStatus(message, type) {
        const statusBox = document.getElementById('statusBox');
        statusBox.className = `btn-status status-${type}`;
        statusBox.style.display = "block";
        statusBox.innerHTML = message;
    }
</script>
</body>
</html>
