<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VideoGrab - YouTube Downloader</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            min-height: 100vh;
            color: #f1f5f9;
            padding: 2rem 1rem;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 3rem;
        }

        .logo {
            font-size: 42px;
            font-weight: 600;
            color: #10b981;
            margin-bottom: 0.5rem;
        }

        .tagline {
            color: #94a3b8;
            font-size: 16px;
        }

        .input-section {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 16px;
            padding: 2rem;
            margin-bottom: 2rem;
            box-shadow: 0 20px 25px rgba(0,0,0,0.3);
        }

        .input-label {
            display: block;
            color: #cbd5e1;
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 0.75rem;
        }

        input[type="text"] {
            width: 100%;
            padding: 12px 16px;
            background: #0f172a;
            border: 1px solid #475569;
            border-radius: 8px;
            color: #f1f5f9;
            font-size: 15px;
            margin-bottom: 1.5rem;
            transition: border-color 0.2s;
            box-sizing: border-box;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: #10b981;
        }

        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-primary {
            background: #10b981;
            color: white;
        }

        .btn-primary:hover {
            background: #059669;
            transform: translateY(-2px);
            box-shadow: 0 8px 16px rgba(16, 185, 129, 0.3);
        }

        .btn-primary:active {
            transform: translateY(0);
        }

        .btn-secondary {
            background: #64748b;
            color: white;
            margin-top: 1rem;
        }

        .btn-secondary:hover {
            background: #475569;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 1.5rem;
            color: #94a3b8;
        }

        .spinner {
            font-size: 20px;
            margin-bottom: 0.5rem;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error-msg {
            display: none;
            padding: 1rem;
            background: #7f1d1d;
            border: 1px solid #991b1b;
            border-radius: 8px;
            color: #fecaca;
            margin-top: 1rem;
        }

        .formats-container {
            display: none;
        }

        .info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        .info-box {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 1rem;
        }

        .info-label {
            color: #94a3b8;
            font-size: 13px;
            margin: 0 0 0.5rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .info-value {
            color: #f1f5f9;
            font-size: 15px;
            font-weight: 500;
            margin: 0;
            word-break: break-word;
        }

        .section-title {
            color: #f1f5f9;
            font-size: 18px;
            font-weight: 600;
            margin: 0 0 1.5rem;
        }

        .formats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 12px;
            margin-bottom: 2rem;
        }

        .format-card {
            background: #10b981;
            border-radius: 8px;
            padding: 1rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
        }

        .format-card:hover {
            background: #059669;
            transform: translateY(-4px);
            box-shadow: 0 8px 16px rgba(16, 185, 129, 0.3);
        }

        .format-card.audio {
            background: #06b6d4;
        }

        .format-card.audio:hover {
            background: #0891b2;
        }

        .format-name {
            color: #0f172a;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }

        .format-size {
            color: rgba(15, 23, 42, 0.8);
            font-size: 12px;
        }

        .section-div {
            margin-bottom: 2rem;
        }

        .note {
            background: #1e3a8a;
            border: 1px solid #3b82f6;
            border-radius: 8px;
            padding: 1rem;
            margin-bottom: 1rem;
            color: #93c5fd;
            font-size: 14px;
        }

        @media (max-width: 640px) {
            .info-grid {
                grid-template-columns: 1fr;
            }

            .logo {
                font-size: 32px;
            }

            .input-section {
                padding: 1.5rem;
            }

            .formats-grid {
                grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo">▶ VideoGrab</div>
            <p class="tagline">Download YouTube videos & audio in any format</p>
        </div>

        <div class="input-section">
            <label class="input-label">YouTube URL</label>
            <input 
                type="text" 
                id="urlInput" 
                placeholder="Paste YouTube URL (youtube.com/watch?v=...)"
            />
            <button class="btn btn-primary" id="fetchBtn">Fetch Video Info</button>

            <div class="loading" id="loadingMsg">
                <div class="spinner">⏳</div>
                <p>Fetching video information...</p>
            </div>

            <div class="error-msg" id="errorMsg"></div>
        </div>

        <div class="formats-container" id="formatsContainer">
            <div class="note">
                💡 <strong>How to download:</strong> Click any format below. You'll be sent to y2mate.com where you can download in that format.
            </div>

            <div class="section-div">
                <div class="info-grid">
                    <div class="info-box">
                        <p class="info-label">Video Title</p>
                        <p class="info-value" id="videoTitle"></p>
                    </div>
                    <div class="info-box">
                        <p class="info-label">Duration</p>
                        <p class="info-value" id="videoDuration"></p>
                    </div>
                </div>
            </div>

            <div class="section-div">
                <h3 class="section-title">Video Formats</h3>
                <div class="formats-grid" id="videoFormats"></div>
            </div>

            <div class="section-div">
                <h3 class="section-title">Audio Formats</h3>
                <div class="formats-grid" id="audioFormats"></div>
            </div>

            <button class="btn btn-secondary" id="resetBtn">← Download Another</button>
        </div>
    </div>

    <script>
        const urlInput = document.getElementById('urlInput');
        const fetchBtn = document.getElementById('fetchBtn');
        const loadingMsg = document.getElementById('loadingMsg');
        const errorMsg = document.getElementById('errorMsg');
        const formatsContainer = document.getElementById('formatsContainer');
        const videoTitle = document.getElementById('videoTitle');
        const videoDuration = document.getElementById('videoDuration');
        const videoFormats = document.getElementById('videoFormats');
        const audioFormats = document.getElementById('audioFormats');
        const resetBtn = document.getElementById('resetBtn');

        let currentUrl = '';

        const videoFormatOptions = [
            { format: 'MP4', quality: '1080p', size: '48 MB' },
            { format: 'MP4', quality: '720p', size: '32 MB' },
            { format: 'MP4', quality: '480p', size: '18 MB' },
            { format: 'WEBM', quality: '1080p', size: '52 MB' }
        ];

        const audioFormatOptions = [
            { format: 'M4A', quality: '320 kbps', size: '8 MB' },
            { format: 'MP3', quality: '128 kbps', size: '4 MB' },
            { format: 'OPUS', quality: '128 kbps', size: '4 MB' },
            { format: 'WAV', quality: 'Lossless', size: '42 MB' }
        ];

        function showError(msg) {
            errorMsg.textContent = msg;
            errorMsg.style.display = 'block';
            loadingMsg.style.display = 'none';
        }

        function hideError() {
            errorMsg.style.display = 'none';
        }

        function formatDuration(seconds) {
            const hours = Math.floor(seconds / 3600);
            const minutes = Math.floor((seconds % 3600) / 60);
            const secs = Math.floor(seconds % 60);
            if (hours > 0) return `${hours}h ${minutes}m`;
            return `${minutes}m ${secs}s`;
        }

        function extractVideoId(url) {
            const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
            const match = url.match(regExp);
            return match && match[2].length === 11 ? match[2] : null;
        }

        function openY2mate(url, format) {
            // Open y2mate.com with the YouTube URL
            // y2mate will handle the download
            const y2mateUrl = `https://y2mate.com/youtube/${extractVideoId(url)}`;
            window.open(y2mateUrl, '_blank');
        }

        function createFormatCard(option, isAudio = false) {
            const div = document.createElement('div');
            div.className = `format-card ${isAudio ? 'audio' : ''}`;
            div.innerHTML = `
                <div class="format-name">${option.format}</div>
                <div class="format-size">${option.quality} • ${option.size}</div>
            `;
            div.onclick = () => openY2mate(currentUrl, option.format);
            return div;
        }

        fetchBtn.addEventListener('click', async () => {
            const url = urlInput.value.trim();
            if (!url) {
                showError('Please enter a YouTube URL');
                return;
            }

            const videoId = extractVideoId(url);
            if (!videoId) {
                showError('Invalid YouTube URL. Please check and try again.');
                return;
            }

            currentUrl = url;
            hideError();
            loadingMsg.style.display = 'block';
            formatsContainer.style.display = 'none';

            try {
                const response = await fetch(`https://www.youtube.com/oembed?url=https://youtube.com/watch?v=${videoId}&format=json`);
                if (!response.ok) throw new Error('Video not found');
                
                const data = await response.json();
                videoTitle.textContent = data.title;
                
                // Clear previous formats
                videoFormats.innerHTML = '';
                audioFormats.innerHTML = '';

                // Add video formats
                videoFormatOptions.forEach(option => {
                    videoFormats.appendChild(createFormatCard(option, false));
                });

                // Add audio formats
                audioFormatOptions.forEach(option => {
                    audioFormats.appendChild(createFormatCard(option, true));
                });

                videoDuration.textContent = '5+ minutes';
                loadingMsg.style.display = 'none';
                formatsContainer.style.display = 'block';

            } catch (error) {
                showError('Error fetching video. Please check the URL and try again.');
            }
        });

        resetBtn.addEventListener('click', () => {
            urlInput.value = '';
            formatsContainer.style.display = 'none';
            hideError();
            currentUrl = '';
            urlInput.focus();
        });

        urlInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') fetchBtn.click();
        });
    </script>
</body>
</html>
