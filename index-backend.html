<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VideoGrab - YouTube Downloader (Backend Enabled)</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            min-height: 100vh;
            color: #f1f5f9;
            padding: 2rem 1rem;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 3rem;
        }

        .logo {
            font-size: 42px;
            font-weight: 600;
            color: #10b981;
            margin-bottom: 0.5rem;
        }

        .tagline {
            color: #94a3b8;
            font-size: 16px;
            margin-bottom: 0.5rem;
        }

        .status {
            font-size: 12px;
            color: #10b981;
            padding: 0.5rem 1rem;
            background: rgba(16, 185, 129, 0.1);
            border-radius: 4px;
            display: inline-block;
        }

        .input-section {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 16px;
            padding: 2rem;
            margin-bottom: 2rem;
            box-shadow: 0 20px 25px rgba(0,0,0,0.3);
        }

        .input-label {
            display: block;
            color: #cbd5e1;
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 0.75rem;
        }

        input[type="text"] {
            width: 100%;
            padding: 12px 16px;
            background: #0f172a;
            border: 1px solid #475569;
            border-radius: 8px;
            color: #f1f5f9;
            font-size: 15px;
            margin-bottom: 1.5rem;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: #10b981;
        }

        .button-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }

        .btn {
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-primary {
            background: #10b981;
            color: white;
            grid-column: span 2;
        }

        .btn-primary:hover {
            background: #059669;
            transform: translateY(-2px);
            box-shadow: 0 8px 16px rgba(16, 185, 129, 0.3);
        }

        .btn-primary:active {
            transform: translateY(0);
        }

        .btn-primary:disabled {
            background: #64748b;
            cursor: not-allowed;
            transform: none;
        }

        .btn-secondary {
            background: #64748b;
            color: white;
            margin-top: 1rem;
        }

        .btn-secondary:hover {
            background: #475569;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 1.5rem;
            color: #94a3b8;
        }

        .spinner {
            font-size: 20px;
            margin-bottom: 0.5rem;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error-msg {
            display: none;
            padding: 1rem;
            background: #7f1d1d;
            border: 1px solid #991b1b;
            border-radius: 8px;
            color: #fecaca;
            margin-top: 1rem;
        }

        .success-msg {
            display: none;
            padding: 1rem;
            background: #064e3b;
            border: 1px solid #10b981;
            border-radius: 8px;
            color: #86efac;
            margin-top: 1rem;
        }

        .formats-container {
            display: none;
        }

        .info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        .info-box {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 1rem;
        }

        .info-label {
            color: #94a3b8;
            font-size: 13px;
            margin: 0 0 0.5rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .info-value {
            color: #f1f5f9;
            font-size: 15px;
            font-weight: 500;
            margin: 0;
            word-break: break-word;
        }

        .section-title {
            color: #f1f5f9;
            font-size: 18px;
            font-weight: 600;
            margin: 0 0 1.5rem;
        }

        .formats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 12px;
            margin-bottom: 2rem;
        }

        .format-card {
            background: #10b981;
            border-radius: 8px;
            padding: 1rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            position: relative;
            overflow: hidden;
        }

        .format-card:hover {
            background: #059669;
            transform: translateY(-4px);
            box-shadow: 0 8px 16px rgba(16, 185, 129, 0.3);
        }

        .format-card.audio {
            background: #06b6d4;
        }

        .format-card.audio:hover {
            background: #0891b2;
        }

        .format-card.downloading {
            background: #f59e0b;
        }

        .format-name {
            color: #0f172a;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }

        .format-size {
            color: rgba(15, 23, 42, 0.8);
            font-size: 12px;
            margin-bottom: 0.5rem;
        }

        .format-progress {
            display: none;
            height: 4px;
            background: rgba(15, 23, 42, 0.2);
            border-radius: 2px;
            overflow: hidden;
        }

        .format-progress-bar {
            height: 100%;
            background: #0f172a;
            width: 0%;
            transition: width 0.2s;
        }

        .section-div {
            margin-bottom: 2rem;
        }

        @media (max-width: 640px) {
            .info-grid {
                grid-template-columns: 1fr;
            }

            .button-group {
                grid-template-columns: 1fr;
            }

            .btn-primary {
                grid-column: span 1;
            }

            .logo {
                font-size: 32px;
            }

            .input-section {
                padding: 1.5rem;
            }

            .formats-grid {
                grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo">▶ VideoGrab</div>
            <p class="tagline">Download YouTube videos & audio in any format</p>
            <div class="status" id="serverStatus">
                ⚠️ Backend offline (API required)
            </div>
        </div>

        <div class="input-section">
            <label class="input-label">YouTube URL</label>
            <input 
                type="text" 
                id="urlInput" 
                placeholder="Paste YouTube URL (youtube.com/watch?v=...)"
            />
            
            <div class="button-group">
                <button class="btn btn-primary" id="fetchBtn">Fetch Video Info</button>
            </div>

            <div class="loading" id="loadingMsg">
                <div class="spinner">⏳</div>
                <p>Fetching video information...</p>
            </div>

            <div class="error-msg" id="errorMsg"></div>
            <div class="success-msg" id="successMsg"></div>
        </div>

        <div class="formats-container" id="formatsContainer">
            <div class="section-div">
                <div class="info-grid">
                    <div class="info-box">
                        <p class="info-label">Video Title</p>
                        <p class="info-value" id="videoTitle"></p>
                    </div>
                    <div class="info-box">
                        <p class="info-label">Duration</p>
                        <p class="info-value" id="videoDuration"></p>
                    </div>
                </div>
            </div>

            <div class="section-div">
                <h3 class="section-title">Video Formats</h3>
                <div class="formats-grid" id="videoFormats"></div>
            </div>

            <div class="section-div">
                <h3 class="section-title">Audio Formats</h3>
                <div class="formats-grid" id="audioFormats"></div>
            </div>

            <button class="btn btn-secondary" id="resetBtn">← Download Another</button>
        </div>
    </div>

    <script>
        // Configuration - Change this to your backend URL
        const BACKEND_URL = 'http://localhost:5000'; // For local development
        // const BACKEND_URL = 'https://your-deployed-api.com'; // For production

        const urlInput = document.getElementById('urlInput');
        const fetchBtn = document.getElementById('fetchBtn');
        const loadingMsg = document.getElementById('loadingMsg');
        const errorMsg = document.getElementById('errorMsg');
        const successMsg = document.getElementById('successMsg');
        const formatsContainer = document.getElementById('formatsContainer');
        const videoTitle = document.getElementById('videoTitle');
        const videoDuration = document.getElementById('videoDuration');
        const videoFormats = document.getElementById('videoFormats');
        const audioFormats = document.getElementById('audioFormats');
        const resetBtn = document.getElementById('resetBtn');
        const serverStatus = document.getElementById('serverStatus');

        let currentUrl = '';

        // Check server status on load
        window.addEventListener('load', checkServerStatus);

        async function checkServerStatus() {
            try {
                const response = await fetch(`${BACKEND_URL}/health`);
                if (response.ok) {
                    serverStatus.innerHTML = '✅ Backend connected';
                    serverStatus.style.color = '#10b981';
                    serverStatus.style.background = 'rgba(16, 185, 129, 0.1)';
                }
            } catch (error) {
                serverStatus.innerHTML = '⚠️ Backend offline (configure BACKEND_URL)';
                serverStatus.style.color = '#f59e0b';
                serverStatus.style.background = 'rgba(245, 158, 11, 0.1)';
            }
        }

        function showError(msg) {
            errorMsg.textContent = msg;
            errorMsg.style.display = 'block';
            successMsg.style.display = 'none';
            loadingMsg.style.display = 'none';
        }

        function showSuccess(msg) {
            successMsg.textContent = msg;
            successMsg.style.display = 'block';
            errorMsg.style.display = 'none';
        }

        function hideError() {
            errorMsg.style.display = 'none';
            successMsg.style.display = 'none';
        }

        function formatDuration(seconds) {
            if (!seconds) return 'Unknown';
            const hours = Math.floor(seconds / 3600);
            const minutes = Math.floor((seconds % 3600) / 60);
            const secs = Math.floor(seconds % 60);
            if (hours > 0) return `${hours}h ${minutes}m`;
            return `${minutes}m ${secs}s`;
        }

        function extractVideoId(url) {
            const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
            const match = url.match(regExp);
            return match && match[2].length === 11 ? match[2] : null;
        }

        function createFormatCard(format, isAudio = false) {
            const div = document.createElement('div');
            div.className = `format-card ${isAudio ? 'audio' : ''}`;
            div.dataset.format = format.format;
            div.dataset.isAudio = isAudio;
            
            div.innerHTML = `
                <div class="format-name">${format.name}</div>
                <div class="format-size">${format.size}</div>
                <div class="format-progress">
                    <div class="format-progress-bar"></div>
                </div>
            `;
            
            div.addEventListener('click', () => downloadFormat(format, isAudio));
            return div;
        }

        async function downloadFormat(format, isAudio) {
            const formCard = document.querySelector(`[data-format="${format.format}"]`);
            
            try {
                formCard.classList.add('downloading');
                formCard.style.opacity = '0.7';
                formCard.style.cursor = 'not-allowed';
                
                const response = await fetch(`${BACKEND_URL}/api/download`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        url: currentUrl,
                        format: format.format,
                        audio_only: isAudio
                    })
                });

                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.error || 'Download failed');
                }

                // Create download link
                const blob = await response.blob();
                const downloadUrl = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = downloadUrl;
                a.download = `${document.getElementById('videoTitle').textContent || 'video'}.${format.format.split('-')[0]}`;
                document.body.appendChild(a);
                a.click();
                window.URL.revokeObjectURL(downloadUrl);
                a.remove();

                showSuccess(`✅ Downloaded: ${format.name}`);
                
            } catch (error) {
                showError(`❌ Error: ${error.message}`);
            } finally {
                formCard.classList.remove('downloading');
                formCard.style.opacity = '1';
                formCard.style.cursor = 'pointer';
            }
        }

        fetchBtn.addEventListener('click', async () => {
            const url = urlInput.value.trim();
            if (!url) {
                showError('Please enter a YouTube URL');
                return;
            }

            const videoId = extractVideoId(url);
            if (!videoId) {
                showError('Invalid YouTube URL. Please check and try again.');
                return;
            }

            currentUrl = url;
            hideError();
            loadingMsg.style.display = 'block';
            formatsContainer.style.display = 'none';

            try {
                const response = await fetch(`${BACKEND_URL}/api/info`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ url })
                });

                if (!response.ok) {
                    throw new Error('Failed to fetch video information');
                }

                const data = await response.json();
                
                videoTitle.textContent = data.title || 'Unknown Title';
                videoDuration.textContent = formatDuration(data.duration);
                
                // Clear previous formats
                videoFormats.innerHTML = '';
                audioFormats.innerHTML = '';

                // Fetch available formats
                const formatsResponse = await fetch(`${BACKEND_URL}/api/formats`);
                const formats = await formatsResponse.json();

                // Add video formats
                formats.video.forEach(format => {
                    videoFormats.appendChild(createFormatCard(format, false));
                });

                // Add audio formats
                formats.audio.forEach(format => {
                    audioFormats.appendChild(createFormatCard(format, true));
                });

                loadingMsg.style.display = 'none';
                formatsContainer.style.display = 'block';
                showSuccess('✅ Video ready for download!');

            } catch (error) {
                showError(`Error: ${error.message} - Make sure backend is running at ${BACKEND_URL}`);
                console.error('Full error:', error);
            }
        });

        resetBtn.addEventListener('click', () => {
            urlInput.value = '';
            formatsContainer.style.display = 'none';
            hideError();
            currentUrl = '';
            urlInput.focus();
        });

        urlInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') fetchBtn.click();
        });
    </script>
</body>
</html>
